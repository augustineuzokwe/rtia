repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # detect-secrets (#126): commit-time scan that catches credentials,
  # API keys, and other high-entropy strings before they land in git
  # history. Companion to the runtime scanner in #124
  # (agents/secret_scan.py) which protects *pasted* requirements at
  # invocation time — this hook protects the *repo tree* at commit
  # time. Different threat surfaces; both layers are needed.
  #
  # The .secrets.baseline file records every string the scanner
  # currently flags as "known acceptable" (test fixtures, doc
  # examples). New findings fail the hook; the contributor either
  # redacts the secret or, if it's a legitimate fixture, refreshes
  # the baseline:
  #     uv run detect-secrets scan --baseline .secrets.baseline
  #
  # Excludes:
  #   .secrets.baseline — the file itself (would self-flag)
  #   uv.lock          — package hashes look like high-entropy secrets
  #   evals/reports/   — generated artifacts, gitignored but listed
  #                      defensively in case a contributor force-adds
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            uv\.lock|
            evals/reports/.*
          )$
