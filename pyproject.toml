[project]
name = "rtia"
version = "0.1.0"
description = "Requirements & Test Intelligence Assistant — multi-agent pipeline for user stories, ACs, and test cases."
authors = [
    { name = "Augustine Uzokwe", email = "augustine.uzokwe@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.104.1",
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "langchain-google-genai>=4.2.3",
    "langgraph>=1.2.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "python-dotenv>=1.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "deepeval>=4.0.3",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
