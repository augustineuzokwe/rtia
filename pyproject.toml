[project]
name = "rtia"
version = "0.1.0"
description = "Requirements & Test Intelligence Assistant — multi-agent pipeline for user stories, ACs, and test cases."
authors = [
    { name = "Augustine Uzokwe", email = "augustine.uzokwe@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
]
