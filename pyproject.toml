[project]
name = "rtia"
version = "1.0.0"
description = "Requirements & Test Intelligence Assistant - multi-agent pipeline for user stories, ACs, and test cases."
authors = [
    { name = "Augustine Uzokwe", email = "augustine.uzokwe@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.107.1",
    "diskcache>=5.6.3",
    "fastapi>=0.136.3",
    "gradio>=6.17.3",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.4",
    "langchain-google-genai>=4.2.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pypdf>=6.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.49.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "deepeval>=4.0.5",
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

# Phase 13.1 - cost + latency budgets enforced in CI.
# Read by evals/check_budgets.py against the eval run report.
#
# Calibrated against a live eval run on the current 7-sample suite
# (sample-01 → sample-07). Observed maxima:
#   per-sample tokens: 15,284 (sample-03 multi-feature)
#   per-sample duration: 23.4s (sample-03)
#   aggregate tokens:   94,966
#   aggregate duration: 147.6s
# Ceilings are set ~40-60% above observed maxima - generous enough to
# absorb prompt tweaks and Gemini latency variance, tight enough to
# catch a real regression. Tighten in a follow-up PR after main
# accumulates more baseline data (same workflow as evals/baselines.md).
#
# Token counts cover the four production agents (Analyst, Story Writer,
# AC Generator, Test Case Writer). Judge calls are excluded because
# they're eval scaffolding, not the pipeline being measured.
#
# When new samples are added to evals/sample-requirements/, the
# AGGREGATE ceilings need a proportional bump. Per-sample ceilings
# should stay stable - a new sample that blows the per-sample budget
# is either malformed or a real signal worth investigating.
[tool.rtia.budgets]
# Per-sample budgets - a single pipeline run end-to-end.
per_sample_total_tokens_max = 22000
per_sample_pipeline_duration_seconds_max = 45

# Aggregate budgets - full eval run across all samples currently in
# evals/sample-requirements/ (7 samples as of Phase 13.1 land).
total_tokens_max = 135000
total_pipeline_duration_seconds_max = 240
