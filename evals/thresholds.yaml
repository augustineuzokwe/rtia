# Per-metric mean-score floors enforced by the CI eval gate.
#
# Floors are NOT the "good" target — they are the "do not regress past this"
# line. Set per-metric based on the empirical stability observed in
# baselines.md (post-Gemini, hashes 19631aecc02a / 990e6ae9e86f /
# e7af2794b28c / 5811bba6f6c8 as of 2026-05-21):
#
# - Programmatic metrics (ac_testability, tc_executability) — pinned at
#   0.80 because they don't move with stochasticity. Any drop indicates a
#   real structural regression in the agent's output shape.
# - Coverage metrics (ac_coverage, tc_coverage_breadth) — 0.80 floor.
#   Single-run variance observed within ±0.10; floor leaves headroom.
# - actor_set_completeness — 0.70 floor. Observed mean post-#102 = 0.87
#   with sample-03 swinging to 0.80 on actor-invention runs. 0.70 catches
#   real regressions without false-flagging on the occasional invented
#   third actor.
# - ambiguity_discipline — 0.30 floor. This metric has the widest single-
#   run variance (0.33-0.86 observed). Post-ADR-0007 (gemini-3.5-flash)
#   the metric consistently scores 0.33 across runs — the new model
#   surfaces fewer / differently-worded ambiguities than 2.5-flash did,
#   and the judge doesn't map them to expected categories cleanly. Same
#   calibration-shift shape we hit with actor labels (#102) and intent
#   (#103). Floor 0.30 accepts current 3.5-flash behaviour and still
#   catches an absolute "discipline collapsed to zero" failure. Tighten
#   when Epic #92's calibration work lands or the Analyst prompt is
#   sharpened for the new model.
# - intent_keyword_overlap (#103) — 0.40 floor. Based on the post-#103
#   2.5-flash baseline (sample-01 0.80, sample-02 1.00, sample-03 0.40).
#   The rebase-onto-3.5-flash live eval re-verifies this is still the
#   right floor; if 3.5-flash intent behavior shifts the empirical floor,
#   this value gets updated in the same commit that updates baselines.md.
#
# A metric not listed here has NO floor enforced (CI gate ignores it).
# Add a key here to start gating on a new metric.

metric_floors:
  actor_set_completeness: 0.70
  ambiguity_discipline: 0.30
  intent_keyword_overlap: 0.40
  # Requirement-fidelity metric (#99). Floor raised from 0.50 → 0.70 in
  # the #98 prompt-sharpening PR: with the new PRESERVE NAMED USER-FACING
  # DETAIL rule across Analyst + Story Writer + AC Generator prompts, all
  # 3 samples score 1.00 (mean 1.00). Floor 0.70 leaves headroom for
  # paraphrase variance while catching any real regression that drops
  # named metrics or UX guarantees again. Tighten further to 0.80 once
  # multi-run-mean stability is observed.
  requirement_fidelity: 0.70
  ac_coverage: 0.80
  ac_testability: 0.80
  tc_coverage_breadth: 0.80
  tc_executability: 0.80
