# PO directive for sample-01-well-structured.
#
# Pairs with the post-Phase-9.3 calibration: sample-01's ground truth now
# permits the "project selection mechanism" ambiguity as in-scope (see
# evals/sample-requirements/sample-01-well-structured.md). When Gemini's
# Analyst surfaces this as a critical ambiguity (as observed in the
# post-Gemini baseline), the runner needs a deterministic PO answer so
# downstream AC scoring isn't shaped by the generic auto-PO fallback.
#
# Substantive answer - the dashboard targets a QA Lead viewing their own
# project work. Default to "the user's selected project" without
# prescribing a UI mechanism (the requirement is deliberately vague on
# UX; the Story Writer should not invent one).

po_directive: |
  Scope this user story to: an authenticated QA Lead seeing the real-time
  test run summary for the project they have selected. Project selection
  itself is out of scope for this story - assume the dashboard already
  knows which project the user is viewing (URL parameter, prior
  selection, single-project default - the specific mechanism is a
  separate UX decision and SHOULD NOT be specified in this story's ACs
  or test cases). The story's behaviour starts once a project is
  selected.
