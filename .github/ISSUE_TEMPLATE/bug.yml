name: Bug report
description: Something in RTIA doesn't behave as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please include enough detail
        that the issue can be reproduced from a fresh clone.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe? Paste relevant output, stack traces, or screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Minimum commands or inputs needed. Include the sample requirement or input
        text when the bug involves the pipeline.
      placeholder: |
        1. uv sync
        2. uv run python scripts/run_pipeline_demo.py sample-02-vague-ambiguous.md
        3. ...
    validations:
      required: true
  - type: input
    id: rtia-commit
    attributes:
      label: RTIA commit / branch
      description: Output of `git rev-parse --short HEAD` (or a PR link).
    validations:
      required: false
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Local (macOS)
        - Local (Linux)
        - CI (GitHub Actions)
        - Other (specify in "What happened?")
    validations:
      required: true
