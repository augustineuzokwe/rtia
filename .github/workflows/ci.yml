name: CI

# Single-stage pipeline: `quality` (lint, format, unit tests; ~30-60s).
#
# The former `regression` job — full live-Gemini eval against the 3
# golden samples + threshold/budget gates — was deleted in issue #332.
# Rationale: ~30 sequential live Gemini calls on every PR meant the gate
# failed structurally on Gemini's hourly weather (502/503/504) rather
# than on real regressions. The retry-classifier in `760999d` correctly
# distinguished transient 5xx vs cap-exhausted 429 but couldn't fix the
# underlying brittleness.
#
# We now follow the industry-standard two-tier eval pattern (mirrored in
# Anthropic's evals, LangSmith experiments, OpenAI's `evals` framework):
#
#   - PR + push-to-main: deterministic offline checks only (this job).
#     `tests/test_graph.py` already covers the full LangGraph pipeline
#     end-to-end via `RTIA_LLM_PROVIDER=fake` (Epic 8) plus per-branch
#     coverage for split / PO checkpoint / story review / error paths.
#   - Nightly cron: live Gemini eval runs on a schedule with its own
#     retry budget and alerting (tracked separately as the PR 2 of #332).
#
# Net effect: PR CI is now ~30-60s, free, and 100% reliable. Live-model
# quality drift surfaces within 24h via the nightly run instead of in
# the middle of a PR review.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the in-flight CI run - no point
# paying for a stale eval when the head has already moved on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pre-commit hooks (ruff check + format)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run pytest -q
