name: CI

# Two CI surfaces:
#   1. quality    - lint, format, unit tests. Runs on every PR and every
#                   push to main. Fast (~30s), free (mocked, no live LLM).
#   2. regression - the live eval gate (DISABLED, `if: false`). Preserved
#                   here as a flip-switch but never runs automatically.
#
# WHY regression is DISABLED (re-confirmed after a brief re-enable, #340):
#   The live eval makes ~24-30 sequential Gemini calls. On GitHub-hosted
#   runners those calls hit a backend pool that regularly returns 500
#   INTERNAL / 503 UNAVAILABLE "high demand" errors (ADR-0007: the same
#   model is fine from a laptop - Google routes runner IP ranges to a
#   congested pool). Retries don't help: a spike outlasts them, and worse,
#   a FAILED run is NOT free - every call that succeeds before the failing
#   one is billed, and each retry re-pays for them. So the gate was the
#   worst of both worlds: red on third-party weather AND costing money,
#   with no budget to throw at mitigations. Re-enabling it on push-to-main
#   (#340) proved this again, live, so it is off again.
#
# WHERE the live quality signal lives instead:
#   - Manual + local: `uv run python evals/run_evals.py --no-cache` before
#     a prompt change, run on a laptop where the runner-pool 5xx don't hit.
#   - CI gates only on fast, free, deterministic tests (the quality job).
#     Structural "did the pipeline break?" coverage belongs in mocked /
#     fake-provider tests (RTIA_LLM_PROVIDER=fake), which never 5xx.
#
# The job body (cache disable, key export, path filter, threshold + budget
# gates, retry classifier) is kept intact so it can be flipped back on
# (`if: false` -> a real condition) if RTIA ever runs the eval on a
# self-hosted runner. test_ci_cache_disable.py still locks the YAML shape.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the in-flight CI run - no point
# paying for a stale run when the head has already moved on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pre-commit hooks (ruff check + format)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run pytest -q

  regression:
    name: Regression (eval gate, Gemini Flash, golden samples)
    # DISABLED. See header comment: live-model gating is unworkable on
    # GitHub runners (500/503 weather) and a failed run still bills for the
    # calls that succeed before it. The live eval is a manual/local step.
    # To re-enable (e.g. on a self-hosted runner): replace `false` with a
    # real condition such as
    #   github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need history to diff the push range for the path filter below.
          fetch-depth: 0

      # Path filter: only spend Gemini calls when this merge actually
      # changed a prompt-affecting path. A docs-only or test-only merge
      # skips the eval (the prompt_hash and pipeline output cannot have
      # moved). Diffs the push range (before..sha); a missing/zero base
      # SHA (first push, force-push) falls back to running, to be safe.
      - name: Detect prompt / agent / eval changes
        id: should_run
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No usable base SHA - running the eval to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE" "${{ github.sha }}" -- agents/ prompts/ evals/ .github/workflows/ci.yml; then
            echo "::notice::No changes to agents/, prompts/, evals/, or this workflow - skipping the eval gate for this merge."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::prompt / agent / eval change detected - running the eval gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # A missing key hard-fails. Silently passing without the eval would
      # defeat the gate's purpose.
      - name: Verify Gemini API key
        if: steps.should_run.outputs.run == 'true'
        env:
          KEY: ${{ secrets.GOOGLE_API_KEY_CI || secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::No Gemini API key available. Set GOOGLE_API_KEY_CI (preferred) or GOOGLE_API_KEY in repo secrets."
            exit 1
          fi

      - name: Install uv
        if: steps.should_run.outputs.run == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.should_run.outputs.run == 'true'
        run: uv sync --all-groups

      # Wrapped in nick-fields/retry to ride out transient Gemini 503s
      # (observed on the first live runs - Gemini returns 503 UNAVAILABLE
      # during high-demand spikes and the in-library tenacity retries can
      # exhaust before the spike clears). 2 attempts x 30s.
      #
      # Issue #329 - retry is classified by exit code: run_evals.py exits
      # 76 on a transient Gemini 5xx (502/503/504) and 75 on a
      # cap-exhausted 429. retry_on_exit_code=76 means only the transient
      # path retries; a real failure (1) or a spend-cap 429 (75) fails fast.
      #
      # Issue #230 - the cache MUST be disabled here, both via env var and
      # the --no-cache flag (belt-and-suspenders), so the gate re-measures
      # live behaviour every run and a warm cache cannot mask model drift
      # (the "false-green CI" trap). See ADR-0013.
      - name: Run eval suite (with retry for transient 503s)
        if: steps.should_run.outputs.run == 'true'
        uses: nick-fields/retry@v4
        env:
          # Keep in sync with the "Verify Gemini API key" step above. The
          # subprocess needs the key exported into its environment - the
          # verify step only checks presence, it does not export it.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY_CI || secrets.GOOGLE_API_KEY }}
          RTIA_LLM_CACHE: disabled
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on_exit_code: 76
          command: uv run python evals/run_evals.py --no-cache --report-path evals/reports/ci-run.json

      - name: Enforce metric floors
        if: steps.should_run.outputs.run == 'true'
        run: uv run python evals/check_thresholds.py evals/reports/ci-run.json

      # Phase 13.1 - cost + latency gate. Separate step from the floors so
      # the status-check name surfaces "budget regression" distinctly from
      # "quality regression" - different signals, different fixes.
      - name: Enforce cost + latency budgets
        if: steps.should_run.outputs.run == 'true'
        run: uv run python evals/check_budgets.py evals/reports/ci-run.json

      - name: Upload eval report
        if: always() && steps.should_run.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ github.run_id }}
          path: evals/reports/ci-run.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # Playwright E2E against the React SPA. Free + deterministic (it never
    # touches a live LLM): every backend runs RTIA_LLM_PROVIDER=fake, so the
    # 4 scenarios are canned fixtures, not Gemini calls - exactly the
    # "fast, free, deterministic" signal the header says CI should gate on.
    # No GOOGLE_API_KEY needed; the fake provider never constructs the
    # Google client. CI wiring for US-27's suite (US-28).
    name: E2E (Playwright, fake provider)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps (for the fake-LLM backends)
        run: uv sync --all-groups

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build the SPA
        # The fake backends serve ui-react/dist at /, so it must exist before
        # they start (globalSetup also builds it, but building here keeps the
        # backend's first GET / from 500ing).
        run: pnpm --filter ui-react build

      - name: Install Playwright Chromium
        run: pnpm --filter e2e install-browsers

      - name: Run E2E suite
        # start backends + wait for readiness + run, all in ONE shell so the
        # backgrounded uv processes stay alive for the test run (a separate
        # step could let them be reaped between steps).
        run: |
          set -euo pipefail
          bash e2e/scripts/start-backends.sh
          for port in 8001 8002 8003 8004; do
            for i in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/" || echo 000)
              if [ "$code" = "401" ]; then echo "  backend :${port} ready"; break; fi
              if [ "$i" -eq 45 ]; then
                echo "::error::backend :${port} never came up (last HTTP code: ${code})"
                cat e2e/scripts/.logs/*.log || true
                exit 1
              fi
              sleep 1
            done
          done
          pnpm --filter e2e test

      - name: Stop fake backends
        if: always()
        run: bash e2e/scripts/stop-backends.sh || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
