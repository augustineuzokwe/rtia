name: Eval gate

# Runs the full Gemini-Flash eval suite against the 3 golden samples and
# fails the build if any metric's mean score drops below its configured
# floor (see evals/thresholds.yaml). Implements US-14 (#19).
#
# **Path filter — by design.** Eval runs cost ≈$0.03 of paid Gemini Flash
# each. Only PRs that touch agent code, prompts, eval logic, or the gate
# config itself trigger the suite. Doc-only / test-only / CI-config PRs
# skip it — those changes cannot regress LLM behaviour.
#
# **Forks**: this workflow requires the GOOGLE_API_KEY secret. PRs from
# forks won't have it; the workflow exits early with a notice instead of
# failing. Maintainer-owned PRs (same repo branches) always run the gate.
#
# Required-check setting on `main`: this workflow must be added to the
# branch-protection rules in GitHub settings — the YAML alone does not
# block merges. See docs/USAGE.md if/when that ADR lands.

on:
  pull_request:
    paths:
      - "agents/**"
      - "prompts/**"
      - "evals/**"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the in-flight gate run — no point
# paying for a stale eval when the PR head has already moved on.
concurrency:
  group: eval-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Eval gate (Gemini Flash, 3 samples, 6 metrics)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for GOOGLE_API_KEY (fork PRs skip the gate)
        id: key_check
        env:
          KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "no_key=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_API_KEY is not available (likely a fork PR). Eval gate skipped."
          else
            echo "no_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.key_check.outputs.no_key != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Install dependencies
        if: steps.key_check.outputs.no_key != 'true'
        run: uv sync --all-groups

      - name: Run eval suite
        if: steps.key_check.outputs.no_key != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          uv run python evals/run_evals.py --report-path evals/reports/ci-run.json

      - name: Enforce metric floors
        if: steps.key_check.outputs.no_key != 'true'
        run: uv run python evals/check_thresholds.py evals/reports/ci-run.json

      - name: Upload eval report
        if: always() && steps.key_check.outputs.no_key != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.event.pull_request.number || github.run_id }}
          path: evals/reports/ci-run.json
          if-no-files-found: ignore
          retention-days: 14
